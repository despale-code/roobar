[package]
name = "roobar"
version = "0.1.1"
edition = "2024"
authors = ["ChickenWM Contributors"]
license = "MIT"
repository = "https://github.com/despale-code/roobar"
description = "Waybar-style top status bar for ChickenWM with live CSS styling and direct workspace synchronization"

[[bin]]
name = "roobar"
path = "src/main.rs"

[dependencies]
chickenwm-core = { git = "https://github.com/despale-code/chickenwm-core", tag = "v0.1.2", features = ["egui", "headless"] }
anyhow = { version = "1.0" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tracing = { version = "0.1" }
parking_lot = { version = "0.12" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.31" }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_StationsAndDesktops", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_System_Com", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", 
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Devices_Bluetooth",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_ProcessStatus",
] }
raw-window-handle = "0.6"
# For `#[windows_core::interface]` (IPolicyConfig); same version the `windows` crate uses.
windows-core = "0.58"
